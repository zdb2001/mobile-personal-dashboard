<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Todo</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <h1>Todo</h1>

    <form id="todo-form">

      <input
        id="todo-input"
        type="text"
        placeholder="今天要做什么？"
        autocomplete="off"
      >

      <button type="submit">
        添加
      </button>

    </form>

    <ul id="todo-list"></ul>

  </main>

  <script src="app.js"></script>

</body>

</html>
